      const lo = h('span', '', r.vol); lo.innerHTML = ICON.spkLo;
      const vb = h('div', 'np-bar', r.vol); r.volFill = h('div', 'np-fill', vb);
      const hi = h('span', '', r.vol); hi.innerHTML = ICON.spkHi;
      r.opt = h('div', 'np-opt', ctrl);
      r.optK = h('span', 'k', r.opt); r.optV = h('span', 'v', r.opt);
      r.msg = h('div', 'np-msg', np);
      const empty = h('div', 'np-empty', np);
      h('div', '', empty, 'Nothing playing');
      h('small', '', empty, 'Pick a song from Music, Spotify or YouTube.');
    }
    function videoShow(on) {
      if (!videoHost) return;
      const P = player();
      const want = !!on && P && P.videoEl && videoHost.contains(P.videoEl);
      videoHost.classList.toggle('on', !!want);
    }
    function setMode(m) {
      mode = m;
      if (r.np) r.np.dataset.mode = m;
      clearTimeout(modeTimer);
      if (m !== 'normal') modeTimer = setTimeout(() => setMode('normal'), 6000);
      if (m !== 'normal' && r.np) r.np.classList.remove('show-vol');
      renderOpt();
      renderTime();
    }
    function renderOpt() {
      const s = st(); if (!s || !r.optK) return;
      if (mode === 'shuffle') { r.optK.textContent = 'Shuffle'; r.optV.textContent = s.shuffle ? 'Songs' : 'Off'; }
      else if (mode === 'repeat') {
        r.optK.textContent = 'Repeat';
        const v = String(s.repeat || 'off');
        r.optV.textContent = v.charAt(0).toUpperCase() + v.slice(1);
      }
      renderIcons();
    }
    function renderIcons() {
      const s = st(); if (!s || !r.icons) return;
      let html = '';
      if (s.shuffle) html += ICON.shuffle;
      if (s.repeat && s.repeat !== 'off') html += ICON.repeat + (s.repeat === 'one' ? '<span class="one">1</span>' : '');
      if (r.icons.dataset.h !== html) { r.icons.dataset.h = html; r.icons.innerHTML = html; }
    }
    function render() {
      if (!root || !r.np) return;
      const s = st(), t = s && s.track;
      r.np.classList.toggle('empty', !t);
      if (!t) { videoShow(false); lastId = null; return; }
      const q = s.queue || [];
      r.count.textContent = q.length > 0 && s.index >= 0 ? (s.index + 1) + ' of ' + q.length : '';
      if (t.id !== lastId) { lastId = t.id; artInto(r.art, t); }
      r.title.textContent = t.title || '';
      r.artist.textContent = t.artist || '';
      r.album.textContent = t.album || '';
      const m = s.mode;
      const yt = t.source === 'youtube';
      r.badge.style.display = m === 'preview' ? '' : 'none';
      const showLink = m === 'link';
      r.link.style.display = showLink ? '' : 'none';
      let msg = s.message || '';
      if (showLink) {
        r.linkText.textContent = msg || (yt ? 'Plays on YouTube' : 'Plays in the Spotify app');
        msg = '';
        r.linkA.textContent = yt ? 'Open in YouTube ↗' : 'Open in Spotify ↗';
        r.linkA.classList.toggle('yt', yt);
        if (t.externalUrl) { r.linkA.href = t.externalUrl; r.linkA.style.display = ''; }
        else { r.linkA.removeAttribute('href'); r.linkA.style.display = 'none'; }
      }
      if (m === 'preview' && /preview/i.test(msg)) msg = '';
      r.msg.textContent = msg;
      r.np.classList.toggle('video', m === 'youtube');
      videoShow(active && m === 'youtube');
      renderOpt();
      renderTime();
    }
    function renderTime() {
      if (!r.fill) return;
      const s = st(), t = s && s.track;
      if (!t) return;
      const pos = Math.max(0, +s.position || 0);
      const dur = (+s.duration > 0 ? +s.duration : (t.durationMs || 0) / 1000);
      const f = dur > 0 ? clamp(pos / dur, 0, 1) : 0;
      r.fill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
      r.diamond.style.transform = 'translateX(' + (f * 216).toFixed(1) + 'px)';
      r.el.textContent = fmt(pos);
      r.rem.textContent = dur > 0 ? '-' + fmt(Math.max(0, dur - pos)) : '--:--';
    }
    function showVolume(v) {
      if (!r.np) return;
      r.volFill.style.transform = 'scaleX(' + clamp(v, 0, 1).toFixed(3) + ')';
      r.np.classList.add('show-vol');
      clearTimeout(volTimer);
      volTimer = setTimeout(() => r.np && r.np.classList.remove('show-vol'), 1600);
    }

    const scr = {
      kind: 'custom', title: 'Now Playing', orientation: 'portrait', screenDrag: true,
      mount(el) {
        root = el;
        build();
        offs.push(on('player:track', () => { if (mode !== 'normal') setMode('normal'); render(); }));
        offs.push(on('player:state', render));
        offs.push(on('player:time', renderTime));
        render();
      },
      unmount() {
        offs.forEach(f => safe(f)); offs = [];
        clearTimeout(modeTimer); clearTimeout(volTimer);

      },
      onShow() { active = true; render(); },
      _onHide() { active = false; videoShow(false); },
      _afterTransition() { if (active) render(); },
      refresh() { render(); },
      onScroll(n) {
        const P = player(), s = st();
        if (!P || !s || !s.track) return true;

        if (mode === 'scrub') {
          safe(() => P.seekBy ? P.seekBy(5 * n) : P.seek((s.position || 0) + 5 * n));
          renderTime();
        } else if (mode === 'shuffle') {
          safe(() => P.setShuffle && P.setShuffle(n > 0));
          renderOpt();
        } else if (mode === 'repeat') {
          const now = performance.now();
          if (now - lastRepeatAt > 220) { lastRepeatAt = now; safe(() => P.cycleRepeat && P.cycleRepeat()); }
          renderOpt();

          const v = clamp((s.volume == null ? 0.8 : +s.volume) + n * 0.04, 0, 1);
          safe(() => P.setVolume && P.setVolume(v));
          showVolume(v);
        }
        return true;
      },
      onSelect() {
        const s = st();
        if (!s || !s.track) return true;
        if (s.mode === 'link' && s.track.externalUrl && r.linkA) { try { r.linkA.click(); } catch (e) {} return true; }
        setMode(MODES[(MODES.indexOf(mode) + 1) % MODES.length]);
        return true;
      }
    };
    return scr;
  }
  Pod.screens.nowPlaying = nowPlayingScreen;

  /* Playing on Spotify (remote now-playing) */
  function spotifyNowScreen() {
    let root = null, r = {}, offs = [], timer = 0, lastId = null;
    function build() {
      root.textContent = '';
      const np = r.np = h('div', 'np spx', root);
      const stLine = h('div', 'np-top', np);
      r.state = h('span', '', stLine);
      buildArt(np, r);
      const meta = h('div', 'np-meta', np);
      r.title = h('div', 'np-title', meta);
      r.artist = h('div', 'np-artist', meta);
      r.album = h('div', 'np-album', meta);
      const ctrl = h('div', 'np-ctrl', np);
      buildProgress(ctrl, r);
      r.open = h('a', 'spx-open', np, 'Open in Spotify ↗');
      r.open.target = '_blank'; r.open.rel = 'noopener';
      r.hint = h('div', 'spx-hint', np, 'Playing on your Spotify app');
      const empty = h('div', 'np-empty', np);
      r.emptyMain = h('div', '', empty, 'Nothing playing on Spotify right now');
      r.emptySub = h('small', '', empty, 'Start something in the Spotify app and it will show up here.');
    }
    function np() { const S = spotify(); return S && S.nowPlaying; }
    function render() {
      if (!root) return;
      const n = np(), t = n && n.track;
      r.np.classList.toggle('empty', !t);
      if (!t) {
        const S = spotify();
        r.emptySub.textContent = (S && S.status !== 'connected' && S.statusMessage) ? S.statusMessage
          : 'Start something in the Spotify app and it will show up here.';
        return;
      }
      if (t.id !== lastId) { lastId = t.id; artInto(r.art, t); }
      r.state.textContent = n.isPlaying ? 'Playing on Spotify' : 'Paused on Spotify';
      r.title.textContent = t.title || '';
      r.artist.textContent = t.artist || '';
      r.album.textContent = t.album || '';
      if (t.externalUrl) { r.open.href = t.externalUrl; r.open.style.display = ''; }
      else { r.open.removeAttribute('href'); r.open.style.display = 'none'; }
      r.hint.textContent = n.isPlaying ? 'Playing on your Spotify app' : 'Paused in your Spotify app';
      tick();
    }
    function tick() {
      const n = np(); if (!n || !n.track || !r.fill) return;
      const dur = (+n.durationMs || +n.track.durationMs || 0) / 1000;
      let pos = (+n.progressMs || 0) / 1000;
      if (n.isPlaying && n.fetchedAt) pos += Math.max(0, Date.now() - n.fetchedAt) / 1000;
      if (dur > 0) pos = Math.min(pos, dur);
      const f = dur > 0 ? clamp(pos / dur, 0, 1) : 0;
      r.fill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
      r.el.textContent = fmt(pos);
      r.rem.textContent = dur > 0 ? '-' + fmt(Math.max(0, dur - pos)) : '--:--';
    }
    return {
      kind: 'custom', title: 'Spotify', orientation: 'portrait',
      mount(el) {
        root = el; build();
        offs.push(on('spotify:nowplaying', render));
        offs.push(on('spotify:status', render));
        timer = setInterval(tick, 500);
        render();
      },
      unmount() { offs.forEach(f => safe(f)); offs = []; clearInterval(timer); root = null; },
      onShow: render,
      refresh: render,
      onSelect() { if (r.open && r.open.getAttribute('href')) { try { r.open.click(); } catch (e) {} } return true; }
    };
  }

  /* ---------------- public API ---------------- */
  let mounted = false;
  Pod.ui = {
    mount(root) {
      if (mounted) return;
      mounted = true;
      root = root || document.getElementById('app') || document.body;
      buildDevice(root);
      bindWheel();
      bindScreen();
      bindKeys();
      ['library:change', 'spotify:status', 'spotify:nowplaying', 'player:track', 'youtube:ready'].forEach(evt =>
        on(evt, () => queueMenuRefresh(evt)));
      on('library:change', () => { const e = top(); if (e && e.art) e.art.kick(); });
      on('player:state', updateStatusPlay);
      on('player:track', updateStatusPlay);
      let rz = 0;
      window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => fit(true)); });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && actx && actx.state === 'suspended') safe(() => actx.resume().catch(function () {}));
      });
      fit(true);
      push(mainMenu());
      updateStatusPlay();
    },
    push, pop, home, replace, current, refresh, toast, prompt,
    // test/debug helpers (not part of the contract)
    _input: { scroll: doScroll, select: doSelect, menu: doMenu, prev: doPrev, next: doNext, play: doPlay },
    _stackDepth: () => stack.length
  };
})();

</script>
<script>/* ---- stubs.js ---- */

        return c.toDataURL();
      },
      url(x, size) { return Promise.resolve(this.generated(x.artSeed, x.title || x.album, x.artist, size)); },

    Pod.player = {
      state, videoEl: document.createElement('div'),
      play(t, q, i) { state.track = t; state.queue = q || [t]; state.index = i == null ? state.queue.indexOf(t) : i;
        state.playing = true; state.mode = 'preview'; state.duration = (t.durationMs || 30000) / 1000; state.position = 0;
        Pod.bus.emit('player:track', t); Pod.bus.emit('player:state', state); },
      toggle() { state.playing = !state.playing; Pod.bus.emit('player:state', state); },

      seekBy(d) { this.seek(Math.max(0, state.position + d)); },
      setVolume(v) { state.volume = Math.max(0, Math.min(1, v)); Pod.bus.emit('player:state', state); },
      setShuffle(b) { state.shuffle = !!b; }, cycleRepeat() {}
    };
  }
  if (!Pod.sources) Pod.sources = {};
  if (!Pod.sources.spotify) {
    Pod.sources.spotify = { status: 'unavailable', statusMessage: 'Stub', nowPlaying: null, init() {},
      connect() { return Promise.resolve(); }, loadList() { return Promise.resolve([]); }, search() { return Promise.resolve([]); } };
  }
  if (!Pod.sources.local) Pod.sources.local = { pick() {}, addFiles() { return Promise.resolve([]); } };
  if (!Pod.sources.youtube) Pod.sources.youtube = { available: false, init() {}, addUrl() { return null; } };
  if (!Pod.screens.coverFlow) {
    Pod.screens.coverFlow = () => ({ kind: 'custom', title: 'Cover Flow', orientation: 'landscape',
      mount(el) { el.innerHTML = '<div style="color:#fff;padding:20px;background:#000;height:100%">Cover Flow stub</div>'; } });
  }

      mount(el) { el.textContent = 'Now Playing stub'; } });
  }
  if (!Pod.ui) {
    // Minimal harness UI: shows one screen full-window; arrow keys/enter/esc drive it.
    let stack = [], host;
    function render() {
      host.innerHTML = ''; const s = stack[stack.length - 1]; if (!s) return;
      const land = s.orientation === 'landscape';
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;left:20px;top:20px;overflow:hidden;background:#fff;width:' + (land ? 376 : 240) + 'px;height:' + (land ? 240 : 376) + 'px';
