<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nano Player</title>
<style>
html,body{margin:0;height:100%;background:#0d0e10;overflow:hidden;-webkit-tap-highlight-color:transparent;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
#app{position:fixed;inset:0;}
/* ---- ui.css ---- */
/* ui.css — device body, screen, status bar, menus, click wheel, Now Playing, prompt/toast (Agent A) */

.pod-root { position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 80% 65% at 50% 42%, #2a2c31 0%, #17181b 55%, #0b0c0e 100%);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.pod-root::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 40% 8% at 50% 92%, rgba(0,0,0,.35), transparent 70%); }

/* ---------------- device body ---------------- */
.pod-device { position: absolute; left: 50%; top: 50%; width: 312px; height: 728px;
  margin-left: -156px; margin-top: -364px; border-radius: 34px;
  transition: transform .45s cubic-bezier(.45,.05,.25,1);
  background:
    linear-gradient(90deg, rgba(0,0,0,.62) 0, rgba(0,0,0,.30) 1.6%, rgba(255,255,255,.10) 4.5%,
      rgba(255,255,255,.04) 10%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 78%,
      rgba(255,255,255,.035) 90%, rgba(255,255,255,.07) 95.5%, rgba(0,0,0,.30) 98.4%, rgba(0,0,0,.62) 100%),
    linear-gradient(180deg, rgba(255,255,255,.13) 0, rgba(255,255,255,.03) 1.5%, rgba(255,255,255,0) 30%,
      rgba(0,0,0,0) 75%, rgba(0,0,0,.10) 98%, rgba(0,0,0,.35) 100%),
    linear-gradient(90deg, #4a4d52 0%, #5b5e64 35%, #5f6268 50%, #595c62 65%, #4a4d52 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.10),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.5),
    0 0 0 1px rgba(0,0,0,.55),
    0 2px 3px rgba(0,0,0,.45),
    0 28px 60px -10px rgba(0,0,0,.75),
    0 10px 24px rgba(0,0,0,.45);
}
.pod-device.pod-noanim, .pod-noanim * { transition: none !important; }
.pod-brush { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 34px; pointer-events: none;
  opacity: .9; }
.pod-sheen { position: absolute; inset: 0; border-radius: 34px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.055) 44%, rgba(255,255,255,0) 58%); }

/* glass + screen */
.pod-glass { position: absolute; left: 14px; top: 22px; width: 284px; height: 416px; border-radius: 7px;
  background: linear-gradient(180deg, #0b0b0d, #050506 40%, #08080a);
  box-shadow: 0 0 0 1px rgba(0,0,0,.85), 0 1px 0 1px rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.04); }
.pod-glass-gloss { position: absolute; inset: 0; border-radius: 7px; pointer-events: none; z-index: 40;
  background: linear-gradient(152deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,.03) 34%, rgba(255,255,255,0) 34.2%); }
.pod-screen { position: absolute; left: 22px; top: 20px; width: 240px; height: 376px; overflow: hidden;
  background: #000; touch-action: none; isolation: isolate;
  box-shadow: 0 0 0 1px #000; font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  -webkit-font-smoothing: antialiased; }
.pod-layers { position: absolute; inset: 0; }
.pod-layer { position: absolute; left: 0; top: 0; width: 240px; height: 376px; overflow: hidden; background: #fff;
  contain: layout paint; }
.pod-layer.landscape { width: 376px; height: 240px; left: -68px; top: 68px; transform: rotate(90deg); background: #000; }
.pod-layer.hidden { visibility: hidden; }
.pod-custom { position: absolute; inset: 0; overflow: hidden; }

/* ---------------- status bar ---------------- */
.pod-status { position: absolute; left: 0; top: 0; width: 240px; height: 20px; z-index: 10; box-sizing: border-box;
  background: linear-gradient(180deg, #fefefe 0%, #eceef0 48%, #dcdfe2 52%, #ced2d6 100%);
  border-bottom: 1px solid #8d939b; box-shadow: 0 1px 0 rgba(0,0,0,.06);
  transition: transform .3s ease, opacity .3s ease; }
.pod-status.off { transform: translateY(-100%); opacity: 0; }
.pod-status-title { position: absolute; left: 30px; right: 30px; top: 0; height: 19px; text-align: center;
  font: bold 12.5px/19px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1c1e21; letter-spacing: -.1px;
  text-shadow: 0 1px 0 rgba(255,255,255,.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod-status-play { position: absolute; left: 7px; top: 4.5px; width: 10px; height: 10px; color: #2c6fd1;
  filter: drop-shadow(0 1px 0 rgba(255,255,255,.8)); }
.pod-status-play svg { display: block; width: 10px; height: 10px; fill: currentColor; }
.pod-batt { position: absolute; right: 8px; top: 5px; width: 20px; height: 9px; box-sizing: border-box;
  border: 1px solid #5d636b; border-radius: 2px; background: linear-gradient(#fff, #e4e6e9);
  box-shadow: 0 1px 0 rgba(255,255,255,.8); }
.pod-batt::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px;
  background: #5d636b; border-radius: 0 1px 1px 0; }
.pod-batt i { position: absolute; left: 1px; top: 1px; bottom: 1px; width: 78%; border-radius: 1px;
  background: linear-gradient(180deg, #c9f59d 0%, #7fd13f 45%, #5cb423 55%, #4ea11b 100%); }

/* ---------------- menus ---------------- */
.pod-menu { position: absolute; left: 0; right: 0; top: 20px; bottom: 0; background: #fff; }
.pod-list { position: absolute; left: 0; top: 0; bottom: 0; right: 0; overflow: hidden; }
.pod-menu.has-scroll .pod-list { right: 8px; }
.pod-menu.split .pod-list { right: 96px; }
.pod-menu.split.has-scroll .pod-list { right: 104px; }
.pod-rows { position: relative; transition: transform .14s cubic-bezier(.2,.7,.3,1); }
.pod-rows.instant { transition: none; }
.pod-row { position: relative; display: flex; align-items: center; height: 28px; box-sizing: border-box;
  padding: 0 8px 0 8px; color: #000; text-decoration: none; white-space: nowrap; cursor: pointer;
  font: bold 15px/28px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.15px; }
.pod-row .lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pod-row .det { flex: 0 1 auto; max-width: 48%; margin-left: 6px; overflow: hidden; text-overflow: ellipsis;
  font-size: 12px; color: #80858c; letter-spacing: 0; }
.pod-row .chev { flex: none; width: 6px; height: 6px; margin: 0 3px 0 8px; border: solid #a2a6ac;
  border-width: 2.4px 2.4px 0 0; transform: rotate(45deg); }
.pod-row.hl { color: #fff; text-shadow: 0 -1px 0 rgba(0,40,110,.35);
  background: linear-gradient(180deg, #6fb0f5 0%, #4a98ec 8%, #3a8be5 48%, #2a78da 52%, #1c66cc 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 #1758b4; }
.pod-row.hl .det { color: #e3eeff; }
.pod-row.hl .chev { border-color: #fff; }
.pod-row.disabled { color: #9ca0a6; cursor: default; }
.pod-row.multi { height: auto; white-space: normal; padding: 6px 10px 7px; line-height: 15px; font-size: 12.5px;
  color: #6c7178; letter-spacing: 0; }
/* selectable multi-line rows (Spotify Setup Help): wrap long URLs, highlight like other rows */
.pod-row.multi .lbl { overflow-wrap: anywhere; }
.pod-row.multi.hl { color: #fff; }
.pod-row.info-row { color: #6c7178; }
.pod-sb { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; display: none; box-sizing: border-box;
  background: linear-gradient(90deg, #c4c7cb, #eef0f2 45%, #e1e3e6); border-left: 1px solid #a3a8ae; }
.pod-menu.split .pod-sb { right: 96px; }
.pod-menu.has-scroll .pod-sb { display: block; }
.pod-thumb { position: absolute; left: 1px; right: 1px; top: 0; border-radius: 3px; min-height: 12px;
  background: linear-gradient(90deg, #6a7077 0%, #a5aab1 45%, #8c9198 60%, #646a71 100%);
  box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25);
  transition: transform .14s cubic-bezier(.2,.7,.3,1); }
.pod-rows.instant + .pod-thumb, .pod-thumb.instant { transition: none; }

/* split main menu art panel */
.pod-art { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; overflow: hidden; background: #111; }
.pod-art::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 7px 0 9px -5px rgba(0,0,0,.6); border-left: 1px solid rgba(0,0,0,.35); }
.pod-art img { position: absolute; left: 0; top: 0; width: 356px; height: 356px; opacity: 0; object-fit: cover;
  transform-origin: 50% 50%; }
.pod-art-empty { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease;
  background:
    radial-gradient(circle at 30% 20%, rgba(120,160,255,.45), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(200,90,190,.35), transparent 50%),
    linear-gradient(165deg, #1e2a46 0%, #2c2550 45%, #121524 100%); }
.pod-art.empty .pod-art-empty { opacity: 1; }
.pod-art-empty::before { content: ''; position: absolute; left: -50%; top: -10%; width: 200%; height: 120%;
  background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%);
  animation: pod-sweep 7s ease-in-out infinite; }
@keyframes pod-sweep { 0% { transform: translateX(-40%); } 100% { transform: translateX(40%); } }

/* ---------------- click wheel ---------------- */
.pod-wheel { position: absolute; left: 46px; top: 468px; width: 220px; height: 220px; border-radius: 50%;
  touch-action: none; cursor: pointer;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.25) 100%),
    radial-gradient(ellipse 90% 70% at 50% 18%, rgba(255,255,255,.07), rgba(255,255,255,0) 60%),
    radial-gradient(circle at 50% 50%, #2b2c30 0%, #26272a 60%, #1f2023 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.55),
    0 -1px 1px rgba(0,0,0,.35),
    0 1.5px 0 rgba(255,255,255,.16),
    inset 0 1px 1px rgba(255,255,255,.07),
    inset 0 -2px 5px rgba(0,0,0,.35); }
.pod-wl { position: absolute; color: #c5c8cd; opacity: .9; pointer-events: none;
  transition: opacity .08s, transform .08s, color .08s; }
.pod-wl svg { display: block; fill: currentColor; }
.pod-wl.pressed { color: #fff; opacity: 1; transform: scale(.94); }
.pod-wl-menu { left: 0; right: 0; top: 19px; text-align: center;
  font: bold 13.5px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .5px; }
.pod-wl-prev { left: 17px; top: 104px; }
.pod-wl-next { right: 17px; top: 104px; }
.pod-wl-play { left: 98px; bottom: 21px; }
.pod-wpress { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  transition: opacity .1s; background: rgba(0,0,0,.18); }
.pod-wpress.on { opacity: 1; transition: none; }
.pod-center { position: absolute; left: 68px; top: 68px; width: 84px; height: 84px; border-radius: 50%;
  touch-action: none; cursor: pointer;
  background:
    radial-gradient(ellipse 75% 45% at 50% 18%, rgba(255,255,255,.12), rgba(255,255,255,0) 70%),
    radial-gradient(circle at 50% 40%, #2e2f33 0%, #1d1e21 70%, #18191b 100%);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.7),
    0 1px 0 1px rgba(255,255,255,.06),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -2px 4px rgba(0,0,0,.35);
  transition: box-shadow .08s, filter .08s; }
.pod-center.pressed { filter: brightness(.82);
  box-shadow: 0 0 0 1px rgba(0,0,0,.75), inset 0 2px 6px rgba(0,0,0,.55); }

/* ---------------- video host (YouTube) ---------------- */
.pod-video-host { position: absolute; left: 8px; top: 59px; width: 224px; height: 126px; z-index: 5; background: #000;
  visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .15s, visibility 0s .15s; overflow: hidden; }
.pod-video-host.on { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .2s .25s, visibility 0s .25s; }
.pod-video-host > * { width: 100% !important; height: 100% !important; display: block; border: 0; }

/* ---------------- overlays: toast + prompt ---------------- */
.pod-overlay { position: absolute; left: 0; top: 0; width: 240px; height: 376px; z-index: 30; pointer-events: none; }
.pod-overlay.landscape { width: 376px; height: 240px; left: -68px; top: 68px; transform: rotate(90deg); }
.pod-toast { position: absolute; left: 50%; bottom: 34px; max-width: 200px; transform: translate(-50%, 6px);
  padding: 8px 13px; border-radius: 10px; background: rgba(18,19,21,.84); color: #fff; text-align: center;
  font: bold 12.5px/16px "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
.pod-toast.show { opacity: 1; transform: translate(-50%, 0); }
.pod-overlay.landscape .pod-toast { max-width: 300px; bottom: 22px; }
.pod-prompt { position: absolute; inset: 0; pointer-events: auto; background: rgba(0,0,0,.42);
  display: flex; justify-content: center; align-items: flex-start; opacity: 0; transition: opacity .18s ease; }
.pod-prompt.show { opacity: 1; }
.pod-prompt-panel { margin-top: 46px; width: 216px; box-sizing: border-box; padding: 0 0 10px; border-radius: 10px;
  overflow: hidden; background: linear-gradient(180deg, #f7f8f9, #e7e9ec);
  box-shadow: 0 8px 22px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.35), inset 0 1px 0 #fff;
  transform: scale(.94); transition: transform .18s cubic-bezier(.2,.8,.3,1.2); }
.pod-prompt.show .pod-prompt-panel { transform: scale(1); }
.pod-overlay.landscape .pod-prompt-panel { margin-top: 18px; width: 300px; }
.pod-prompt-title { height: 24px; font: bold 12.5px/24px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1c1e21;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px;
  background: linear-gradient(180deg, #fefefe 0%, #eceef0 48%, #dcdfe2 52%, #ced2d6 100%);
  border-bottom: 1px solid #9aa0a7; text-shadow: 0 1px 0 #fff; }
.pod-prompt input { display: block; width: calc(100% - 20px); margin: 10px 10px 10px; box-sizing: border-box; height: 30px;
  padding: 0 8px; border: 1px solid #8f959c; border-radius: 6px; background: #fff; color: #000; outline: none;
  font: 16px/28px "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: inset 0 1px 2px rgba(0,0,0,.22);
  -webkit-user-select: text; user-select: text; }
.pod-prompt input:focus { border-color: #2a78da; box-shadow: inset 0 1px 2px rgba(0,0,0,.2), 0 0 0 2px rgba(58,139,229,.35); }
.pod-prompt-btns { display: flex; gap: 8px; padding: 0 10px; }
.pod-prompt-btns button { flex: 1; height: 28px; border-radius: 6px; cursor: pointer; padding: 0;
  font: bold 13px/26px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #222; border: 1px solid #8a9097;
  background: linear-gradient(180deg, #ffffff, #e9ebee 50%, #dadde1 51%, #cfd3d8); text-shadow: 0 1px 0 #fff; }
.pod-prompt-btns button.ok { color: #fff; border-color: #1655ad; text-shadow: 0 -1px 0 rgba(0,0,0,.25);
  background: linear-gradient(180deg, #6fb0f5 0%, #3a8be5 50%, #2a78da 51%, #1c66cc 100%); }
.pod-prompt-btns button:active { filter: brightness(.88); }

/* ---------------- Now Playing ---------------- */
.np { position: absolute; inset: 0; color: #fff; overflow: hidden;
  background: linear-gradient(180deg, #1b1c1f 0%, #050506 38%, #000 100%);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
.np-top { position: absolute; left: 0; right: 0; top: 24px; height: 14px; text-align: center;
  font: bold 11px/14px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #a3a8af; }
.np-icons { position: absolute; right: 9px; top: 1px; display: flex; gap: 4px; color: #a3a8af; }
.np-icons svg { display: block; width: 13px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.np-icons .one { font: bold 7px/12px sans-serif; margin-left: -3px; }
.np-artbox { position: absolute; left: 38px; top: 40px; width: 164px; height: 164px; }
.np-art { position: absolute; left: 0; top: 0; width: 164px; height: 164px; display: block; background: #222;
  box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
.np-refl { position: absolute; left: 0; top: 165px; width: 164px; height: 22px; overflow: hidden; }
.np-refl img { position: absolute; left: 0; top: 0; width: 164px; height: 164px; transform: scaleY(-1);
  transform-origin: 50% 50%; opacity: .5; }
.np-refl::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.9) 70%, #000 100%); }
.np-badge { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 8px;
  background: rgba(0,0,0,.66); color: #fff; font: bold 8.5px/12px "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: .4px; text-transform: uppercase; box-shadow: 0 0 0 .5px rgba(255,255,255,.25); }
.np-link { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background: rgba(0,0,0,.72); text-align: center; padding: 0 10px; box-sizing: border-box; }
.np-link-text { font: bold 12.5px/15px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
.np-link a { display: inline-block; padding: 0 14px; height: 30px; border-radius: 15px; color: #fff; text-decoration: none;
  font: bold 13px/30px "Helvetica Neue", Helvetica, Arial, sans-serif; white-space: nowrap;
  background: linear-gradient(180deg, #2fd56a, #1db954 50%, #17a649); box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3); }
.np-link a.yt { background: linear-gradient(180deg, #ff4d4d, #e62117 50%, #c9150c); }
.np-link a:active { filter: brightness(.88); }
.np.video .np-artbox { left: 8px; width: 224px; }
.np.video .np-art, .np.video .np-refl, .np.video .np-badge { visibility: hidden; }
.np.video .np-artbox::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 164px; background: #000;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.np-meta { position: absolute; left: 10px; right: 10px; top: 230px; text-align: center; }
.np-meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-title { font: bold 15px/19px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
.np-artist { font: bold 12.5px/17px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #d2d5d9; }
.np-album { font: 12.5px/16px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #8e939a; }
.np-ctrl { position: absolute; left: 12px; right: 12px; top: 292px; height: 32px; }
.np-ctrl > div { position: absolute; inset: 0; transition: opacity .15s; }
.np-bar { position: absolute; left: 0; right: 0; top: 2px; height: 8px; border-radius: 4px; overflow: hidden;
  background: linear-gradient(180deg, #2b2d31, #45484d); box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.08); }
.np-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(180deg, #a9d0fb 0%, #5aa1ee 45%, #2f7fe0 55%, #2a6fcc 100%); }
.np-diamond { position: absolute; left: -6px; top: 0px; width: 12px; height: 12px; display: none; }
.np-diamond::before { content: ''; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; transform: rotate(45deg);
  background: linear-gradient(135deg, #fff, #c9ccd1); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.6); }
.np[data-mode="scrub"] .np-diamond { display: block; }
.np[data-mode="scrub"] .np-fill { opacity: .75; }
.np-times { position: absolute; left: 0; right: 0; top: 14px; display: flex; justify-content: space-between;
  font: bold 11px/14px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #b9bdc3; font-variant-numeric: tabular-nums; }
.np-vol { display: flex; align-items: center; gap: 7px; opacity: 0; height: 12px; top: 0 !important; bottom: auto !important; }
.np-vol svg { flex: none; width: 13px; height: 12px; fill: #c5c8cd; }
.np-vol .np-bar { position: relative; flex: 1; top: 0; }
.np-opt { opacity: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font: bold 13px/18px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
.np-opt .v { color: #7fb6f5; min-width: 44px; }
.np.show-vol .np-prog { opacity: 0; }
.np.show-vol .np-vol { opacity: 1; }
.np[data-mode="shuffle"] .np-prog, .np[data-mode="repeat"] .np-prog { opacity: 0; }
.np[data-mode="shuffle"] .np-opt, .np[data-mode="repeat"] .np-opt { opacity: 1; }
.np[data-mode="shuffle"].show-vol .np-vol, .np[data-mode="repeat"].show-vol .np-vol { opacity: 0; }
.np-msg { position: absolute; left: 10px; right: 10px; top: 330px; text-align: center; color: #8e939a;
  font: bold 10.5px/13px "Helvetica Neue", Helvetica, Arial, sans-serif; max-height: 39px; overflow: hidden; }
.np-empty { position: absolute; inset: 20px 0 0; display: none; align-items: center; justify-content: center; flex-direction: column;
  gap: 6px; color: #9ea3aa; font: bold 14px/18px "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; padding: 0 20px; }
.np-empty small { font-size: 11.5px; line-height: 15px; color: #6f747b; }

<div id="app"></div>
<script>/* ---- core.js ---- */
/* core.js — shared namespace, event bus, library store (lead-owned) */
(function () {
  'use strict';
  const Pod = (window.Pod = window.Pod || {});
  Pod.screens = Pod.screens || {};

  /* ---------- event bus ---------- */
  const handlers = new Map();
  Pod.bus = {
    on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return () => Pod.bus.off(evt, fn);
    },
    off(evt, fn) { const s = handlers.get(evt); if (s) s.delete(fn); },
    emit(evt, data) {
      const s = handlers.get(evt);
      if (!s) return;
      [...s].forEach(fn => { try { fn(data); } catch (e) { console.error('[bus]', evt, e); } });
    }
  };

  /* ---------- utils ---------- */
  Pod.util = {
    hash(str) {
      let h = 2166136261 >>> 0;
      str = String(str || '');
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return h >>> 0;
    },
    fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + ':' + String(s).padStart(2, '0');
    },
    sortKey(str) {
      return String(str || '').trim().toLowerCase().replace(/^(the|a|an)\s+/, '').replace(/^[^a-z0-9]+/, '');
    },
    letterOf(str) {
      const c = Pod.util.sortKey(str).charAt(0).toUpperCase();
      return /[A-Z]/.test(c) ? c : '#';
    },
    store: {
      get(key, fallback) {
        try { const v = localStorage.getItem('pod:' + key); return v == null ? fallback : JSON.parse(v); }
        catch (e) { return fallback; }
      },
      set(key, value) { try { localStorage.setItem('pod:' + key, JSON.stringify(value)); } catch (e) {} }
    }
  };

  /* ---------- connector access ---------- */
  let mcpPromise = null;
  Pod.getMcp = function () {
    if (mcpPromise) return mcpPromise;
    if (window.__POD_MOCK_MCP) return (mcpPromise = Promise.resolve(window.__POD_MOCK_MCP));
    if (window.claude && typeof window.claude.use === 'function') {
      mcpPromise = Promise.resolve(window.claude.use('mcp')).catch(() => null);
    } else {
      // The runtime may inject window.claude slightly later; wait briefly.
      mcpPromise = new Promise(resolve => {
        let n = 0;
        const t = setInterval(() => {
          if (window.claude && typeof window.claude.use === 'function') {
            clearInterval(t);
            Promise.resolve(window.claude.use('mcp')).then(resolve, () => resolve(null));
          } else if (++n > 20) { clearInterval(t); resolve(null); }
        }, 100);
      });
    }
    return mcpPromise;
  };

  /* ---------- tracks & library ---------- */
  Pod.makeTrack = function (p) {
    const t = Object.assign({
      id: null, source: 'local', title: '', artist: '', album: '', albumArtist: null, trackNo: null,
      durationMs: 0, artUrl: null, artSeed: '', externalUrl: null, previewUrl: null, fileUrl: null, ytId: null
    }, p || {});
    t.title = (t.title && String(t.title).trim()) || 'Unknown Song';
    t.artist = (t.artist && String(t.artist).trim()) || 'Unknown Artist';
    t.album = (t.album && String(t.album).trim()) || 'Unknown Album';
    t.durationMs = Number(t.durationMs) || 0;
    if (!t.artSeed) t.artSeed = t.album + '|' + (t.albumArtist || t.artist);
    if (!t.id) t.id = t.source + ':' + Pod.util.hash(t.title + '|' + t.artist + '|' + t.album);
    return t;
  };

  const byId = new Map();
  const lists = new Map();
  let albumCache = null;

  function changed() { albumCache = null; Pod.bus.emit('library:change'); }

  Pod.library = {
    get tracks() { return [...byId.values()]; },
    add(tracks) {
      (tracks || []).forEach(t => {
        if (!t || !t.id) return;
        const prev = byId.get(t.id);
        byId.set(t.id, prev ? Object.assign(prev, t) : t);
      });
      changed();
    },
    setList(name, tracks) {
      tracks = (tracks || []).filter(Boolean);
      this.add(tracks);
      lists.set(name, tracks.map(t => byId.get(t.id) || t));
      changed();
    },
    list(name) { return lists.get(name) || []; },
    get(id) { return byId.get(id); },
    songs() {
      return this.tracks.sort((a, b) => Pod.util.sortKey(a.title).localeCompare(Pod.util.sortKey(b.title)));
    },
    albums() {
      if (albumCache) return albumCache;
      const map = new Map();
      byId.forEach(t => {
        const artist = t.albumArtist || t.artist;
        const key = (t.album + '|' + artist).toLowerCase();
        if (!map.has(key)) {
          map.set(key, { key, title: t.album, artist, artSeed: t.artSeed, artUrl: t.artUrl, tracks: [] });
        }
        const a = map.get(key);
        if (!a.artUrl && t.artUrl) a.artUrl = t.artUrl;
        a.tracks.push(t);
      });
      albumCache = [...map.values()].map(a => {
        a.tracks.sort((x, y) => ((x.trackNo || 999) - (y.trackNo || 999)) || x.title.localeCompare(y.title));
        a.letter = Pod.util.letterOf(a.title);
        return a;
      }).sort((x, y) => Pod.util.sortKey(x.title).localeCompare(Pod.util.sortKey(y.title)));
      return albumCache;
    },
    artists() {
      const map = new Map();
      byId.forEach(t => {
        const name = t.albumArtist || t.artist;
        if (!map.has(name)) map.set(name, { name, tracks: [], albums: [] });
        map.get(name).tracks.push(t);
      });
      const albums = this.albums();
      map.forEach(a => { a.albums = albums.filter(al => al.artist === a.name); });
      return [...map.values()].sort((x, y) => Pod.util.sortKey(x.name).localeCompare(Pod.util.sortKey(y.name)));
    }
  };

  /* ---------- boot ---------- */
  Pod.boot = function () {
    const root = document.getElementById('app');
    try { Pod.sources && Pod.sources.spotify && Pod.sources.spotify.init(); } catch (e) { console.error(e); }
    try { Pod.sources && Pod.sources.youtube && Pod.sources.youtube.init(); } catch (e) { console.error(e); }
    Pod.ui.mount(root);
  };
})();

</script>

/* art.js — procedural album covers + real-art loading with fallback (Agent B) */
(function () {
  'use strict';
  const Pod = (window.Pod = window.Pod || {});

  /* ---------------- small helpers ---------------- */
  function mulberry(a) {
    a >>>= 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function hex2rgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(r, g, b) {
    return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  }
  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360 / 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return rgb2hex(f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255);
  }

    const x = hex2rgb(a), y = hex2rgb(b);
    return rgb2hex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t);
  }
  function rgba(h, a) { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lum(h) {
    const c = hex2rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });

    ['#f2e8d5', '#e63946', '#1d3557', '#f1b51c', '#141414'],
    ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#e0fbfc'],
    ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51'],
    ['#fefae0', '#283618', '#606c38', '#dda15e', '#bc6c25'],
    ['#0a0a0a', '#ff006e', '#fb5607', '#ffbe0b', '#3a86ff'],
    ['#f8f9fa', '#212529', '#e63946', '#457b9d', '#a8dadc'],
    ['#2b2d42', '#8d99ae', '#edf2f4', '#ef233c', '#d90429'],
    ['#ffcdb2', '#ffb4a2', '#e5989b', '#b5838d', '#6d6875'],
    ['#1a1423', '#3d1e6d', '#8f2d56', '#d81159', '#ffbc42'],
    ['#003049', '#d62828', '#f77f00', '#fcbf49', '#eae2b7'],
    ['#10002b', '#5a189a', '#9d4edd', '#e0aaff', '#ff9e00'],
    ['#f4f1de', '#e07a5f', '#3d405b', '#81b29a', '#f2cc8f'],
    ['#0d1b2a', '#1b263b', '#415a77', '#778da9', '#e0e1dd'],
    ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'],
    ['#22223b', '#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'],
    ['#011627', '#fdfffc', '#2ec4b6', '#e71d36', '#ff9f1c'],

    ['#353535', '#3c6e71', '#ffffff', '#d9d9d9', '#284b63'],
    ['#ffe8d6', '#cb997e', '#6b705c', '#a5a58d', '#3f4238'],
    ['#0f0f0f', '#e8e8e8', '#c1121f', '#780000', '#fdf0d5'],
    ['#232946', '#eebbc3', '#b8c1ec', '#fffffe', '#121629'],

    ['#fff1e6', '#f08080', '#f4978e', '#2f3e46', '#84a98c'],
    ['#2d00f7', '#6a00f4', '#a100f2', '#db00b6', '#f20089'],
    ['#ede0d4', '#7f5539', '#b08968', '#ddb892', '#1f1a17'],
    ['#06d6a0', '#118ab2', '#073b4c', '#ffd166', '#ef476f'],
    ['#e9ecef', '#adb5bd', '#495057', '#212529', '#ff4d00'],

      if (r() < 0.5) cols.unshift(cols.splice(Math.floor(r() * cols.length), 1)[0]);

  const F = {

      const bg = C[0], fg = ink(bg, C.slice(1), 3), big = C.filter(c => c !== bg && c !== fg)[0] || mix(bg, fg, 0.3);

      textBlock(g, T, { x: 18, y: 18, w: 200, h: 60, lines: 2, max: 20, min: 10, weight: '700', fam: F.sans, color: fg, lh: 1.05 });
      smallCaps(g, A, 282, 286, fg, { align: 'right', anchor: 'bottom', y: 286, w: 180, max: 9 });
      grain(g, 0.12);
    },
    // 13. Bokeh light field
    bokeh(g, r, C, T, A) {

      g.fillStyle = bg; g.fillRect(0, 0, 300, 300);

      }

      const tb = textBlock(g, T, { x: 150, y: 246, w: 250, h: 40, lines: 1, max: 22, min: 10, weight: '600', fam: F.sans, color: '#ffffff', align: 'center', track: 0.12, upper: true });
      smallCaps(g, A, 150, tb.top + tb.height + 7, 'rgba(255,255,255,.6)', { align: 'center', max: 8.5, weight: '500', track: 0.35 });

      }
      g.fillStyle = b; g.fill();
      const bc = C[2], bcy = cy === 150 ? 150 : 205, br = cy === 150 ? 78 : 68;
      circle(g, cx, bcy, br + 7, C[3]); circle(g, cx, bcy, br, bc);
      const fg = ink(bc, C, 4);
      const tb = textBlock(g, T, { x: cx, y: bcy - 4, w: br * 1.6, h: br * 1.05, lines: 3, max: 30, min: 10, weight: '800', fam: F.book, color: fg, align: 'center', anchor: 'middle', lh: 1 });
      smallCaps(g, A, cx, tb.top + tb.height + 6, rgba(fg, 0.75), { align: 'center', w: br * 1.5, max: 8, track: 0.2 });
      vignette(g, 0.25);
      grain(g, 0.14);
    }
  };
  const STYLE_NAMES = Object.keys(STYLES);

  /* ---------------- generation + caches ---------------- */
  const genCache = new Map();     // seed|title|size -> dataURL
  const loadState = new Map();    // artUrl -> true (loaded) | false (failed)
  const loadPromise = new Map();  // artUrl -> Promise<bool>

  function meta(x) {
    x = x || {};
    const isTrack = typeof x.album === 'string';
    const title = (isTrack ? x.album : x.title) || 'Unknown Album';
    const artist = (isTrack ? (x.albumArtist || x.artist) : x.artist) || '';
    return { title, artist, seed: x.artSeed || (title + '|' + artist), artUrl: x.artUrl || null };
  }

  function generated(seed, title, artist, size) {
    size = Math.max(16, Math.round(size || 300));
    title = String(title || 'Untitled'); artist = String(artist || '');
    seed = String(seed || (title + '|' + artist));

    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const h = Pod.util.hash(seed);
    const r = mulberry(Math.imul(h ^ (h >>> 16), 0x45d9f3b) ^ 0x9e3779b9);
    r(); r();
    const style = STYLES[STYLE_NAMES[Pod.util.hash('style:' + seed + ':' + h) % STYLE_NAMES.length]];
    const C = palette(r);

    try { style(g, r, C, title, artist); }
    catch (e) { g.setTransform(size / 300, 0, 0, size / 300, 0, 0); g.fillStyle = C[0]; g.fillRect(0, 0, 300, 300); }

    try { url = c.toDataURL('image/jpeg', 0.86); } catch (e) { url = ''; }
    if (!url || url.length < 30) url = c.toDataURL();
    if (genCache.size > 600) genCache.delete(genCache.keys().next().value);
    genCache.set(key, url);
    return url;
  }

  function load(artUrl) {
    if (loadPromise.has(artUrl)) return loadPromise.get(artUrl);
    const p = new Promise(resolve => {
      let done = false;
      const img = new Image();
      const fin = ok => {
        if (done) return; done = true;
        clearTimeout(timer);
        img.onload = img.onerror = null;
        loadState.set(artUrl, ok);
        resolve(ok);
      };

      img.onload = () => fin(img.naturalWidth > 0);
      img.onerror = () => fin(false);
      try { img.decoding = 'async'; img.src = artUrl; } catch (e) { fin(false); }

  Pod.art = {
    styles: STYLE_NAMES.slice(),
    generated,
    /** generated art for an album or track object */
    generatedFor(x, size) { const m = meta(x); return generated(m.seed, m.title, m.artist, size); },
    /** best already-known image without doing work: real art if it loaded, cached generated art, else null */
    peek(x, size) {
      const m = meta(x);
      if (m.artUrl && loadState.get(m.artUrl) === true) return m.artUrl;
      return genCache.get(m.seed + '\u0001' + m.title + '\u0001' + Math.max(16, Math.round(size || 300))) || null;
    },
    /** true once the item's artUrl is known to load (false = failed, undefined = unknown/none) */
    status(x) { const m = meta(x); return m.artUrl ? loadState.get(m.artUrl) : false; },
    url(x, size) {
      const m = meta(x);
      if (!m.artUrl) return Promise.resolve(generated(m.seed, m.title, m.artist, size));
      return load(m.artUrl).then(ok => ok ? m.artUrl : generated(m.seed, m.title, m.artist, size));
    },
    apply(img, x, size) {
      if (!img) return;
      const m = meta(x);
      const tok = (img.__podArtTok = (img.__podArtTok || 0) + 1);
      if (m.artUrl && loadState.get(m.artUrl) === true) { img.src = m.artUrl; return; }
      img.src = generated(m.seed, m.title, m.artist, size);
      if (m.artUrl && loadState.get(m.artUrl) !== false) {
        load(m.artUrl).then(ok => { if (ok && img.__podArtTok === tok) img.src = m.artUrl; });
      }
    }
  };
})();

<script>/* ---- player.js ---- */
/* player.js — playback engine (Agent C)
   One hidden <audio> for local files + Spotify 30s previews, a YouTube IFrame player hosted in
   Pod.player.videoEl, and a 'link' mode for anything that cannot play inside the page. */
(function () {
  'use strict';
  const Pod = window.Pod;
  const store = Pod.util.store;

  const PREVIEW_START_TIMEOUT = 3000;   // CSP-blocked media errors or stalls; give up after this
  const PREVIEW_GRACE = 5000;           // extra wait if data is clearly arriving (slow network, not blocked)
  const YT_READY_TIMEOUT = 8000;

  const state = {
    track: null, queue: [], index: -1, playing: false, position: 0, duration: 0,
    mode: 'idle', shuffle: !!store.get('shuffle', false), repeat: store.get('repeat', 'off'),
    volume: clamp01(Number(store.get('volume', 0.8))), message: '', loading: false
  };
  if (['off', 'all', 'one'].indexOf(state.repeat) < 0) state.repeat = 'off';
  if (!isFinite(state.volume)) state.volume = 0.8;

  let order = [];          // play order: indices into state.queue
  let orderPos = -1;
  let token = 0;           // increments on every track start; stale callbacks compare against it
  let autoAdvancing = false; // the current track was reached by auto-advance (skip it if it can't play)
  let previewsBlocked = false; // per-session: a preview failed to load before any preview ever worked
  let previewsWorked = false;
  const bad = new Set();   // track ids that failed to play this session
  let startTimer = 0;

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function emitState() { Pod.bus.emit('player:state', state); updateSessionState(); }
  function emitTime() { Pod.bus.emit('player:time', state); }

  /* ---------------- audio element ---------------- */
  const audio = new Audio();
  audio.preload = 'auto';
  audio.volume = state.volume;
  audio.setAttribute('playsinline', '');
  let audioActive = false;   // audio element owns the current track

  function audioRelease() {
    audioActive = false;
    clearTimeout(startTimer);
    try { audio.pause(); } catch (e) {}
    if (audio.getAttribute('src')) { audio.removeAttribute('src'); try { audio.load(); } catch (e) {} }
  }

  audio.addEventListener('loadedmetadata', () => {
    if (!audioActive) return;
    if (isFinite(audio.duration) && audio.duration > 0) { state.duration = audio.duration; emitTime(); }
  });
  audio.addEventListener('durationchange', () => {
    if (audioActive && isFinite(audio.duration) && audio.duration > 0) state.duration = audio.duration;
  });
  audio.addEventListener('playing', () => {
    if (!audioActive) return;
    clearTimeout(startTimer);
    if (state.mode === 'preview') { previewsWorked = true; previewsBlocked = false; state.message = '30-sec preview'; }
    else if (state.mode === 'local') state.message = '';
    state.loading = false; state.playing = true;
    emitState();
  });
  audio.addEventListener('pause', () => {
    if (!audioActive || audio.ended) return;
    if (state.playing) { state.playing = false; emitState(); }
  });
  audio.addEventListener('ended', () => { if (audioActive) onEnded(); });
  audio.addEventListener('error', () => {
    if (!audioActive) return;
    audioFailed(audio.error ? audio.error.code : 0);
  });

  function audioFailed(code) {
    const t = state.track; if (!t) return;
    clearTimeout(startTimer);
    if (state.mode === 'preview') {
      if (!previewsWorked) previewsBlocked = true;
      bad.add(t.id);
      audioRelease();
      toLink(t);
      if (autoAdvancing) advanceAuto();
      return;
    }

    bad.add(t.id);
    audioRelease();
    state.playing = false; state.loading = false;
    state.message = "Can't play this file";
    emitState();
    if (autoAdvancing) advanceAuto();
  }

  function startAudio(src, mode) {
    const my = token;
    audioActive = true;
    state.mode = mode;
    state.loading = true;
    audio.src = src;
    audio.volume = state.volume;
    // play() is called synchronously so it stays inside the user gesture.
    let p;
    try { p = audio.play(); } catch (e) { p = Promise.reject(e); }
    Promise.resolve(p).catch(err => {
      if (my !== token || !audioActive) return;
      const name = err && err.name;
      if (name === 'NotAllowedError') {
        // Autoplay policy: the media is fine, it just needs a tap.
        clearTimeout(startTimer);
        state.playing = false; state.loading = false;
        state.message = mode === 'preview' ? '30-sec preview · press play' : 'Press play to start';
        emitState();
      } else if (name === 'AbortError') {
        /* superseded by a newer load */
      } else if (mode === 'preview') {
        audioFailed(0);
      }

    });

  videoEl.className = 'pod-video';
  videoEl.style.cssText = 'position:relative;width:100%;height:100%;background:#000;overflow:hidden;';

  }

  function startYouTube(t) {
    const my = token;
    ytActive = true;
    state.mode = 'youtube';
    state.loading = true;
    state.message = 'YouTube';

        width: '100%', height: '100%', videoId: t.ytId,

              }
            } catch (e) {}

          onStateChange: onYtState,
          onError: e => { if (ytActive && state.track) ytFailed(state.track, false, e && e.data); }

      });
    } catch (e) { ytFailed(t, true); return; }
    clearTimeout(ytReadyTimer);
    ytReadyTimer = setTimeout(() => {
      if (ytReady) return;
      // The iframe never came up (blocked frame / offline). Treat YouTube as unavailable for this session.
      ytBroken = true;
      if (ytActive && my === token && state.track) ytFailed(state.track, true);
    }, YT_READY_TIMEOUT);
  }

  function ytFailed(t, broken, code) {
    if (broken) ytBroken = true;
    bad.add(t.id);
    ytRelease();
    toLink(t, (code === 101 || code === 150) ? "Can't embed · opens on YouTube" : 'Opens on YouTube');
    if (autoAdvancing) advanceAuto();
  }

  function onYtState(e) {
    if (!ytActive) return;
    const S = (window.YT && window.YT.PlayerState) || { ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };
    const s = e && e.data;
    if (s === S.PLAYING) {
      state.playing = true; state.loading = false; state.message = 'YouTube';
      updateYtMeta();
      emitState();
    } else if (s === S.PAUSED) {
      if (state.playing) { state.playing = false; emitState(); }
    } else if (s === S.ENDED) {
      onEnded();
    } else if (s === S.CUED || s === -1) {

      if (state.loading) { state.loading = false; state.playing = false; state.message = 'Tap the video to play'; emitState(); }

    }
  }

  function updateYtMeta() {
    const t = state.track;
    if (!yt || !t || t.source !== 'youtube') return;
    try {
      const d = yt.getDuration();
      if (d > 0) { state.duration = d; t.durationMs = Math.round(d * 1000); }
      const data = yt.getVideoData && yt.getVideoData();
      if (data && data.title && data.video_id === t.ytId && t.title !== data.title) {
        t.title = data.title;
        if (data.author) t.artist = data.author;
        Pod.library.add([t]);
        if (Pod.sources.youtube && Pod.sources.youtube.persist) Pod.sources.youtube.persist();
        Pod.bus.emit('player:track', t);
        setSessionMeta(t);
      }
    } catch (e) {}
  }

  /* ---------------- link mode ---------------- */
  function linkMessage(t) {
    return t && t.source === 'youtube' ? 'Opens on YouTube' : t && t.source === 'spotify' ? 'Plays in the Spotify app' : "Can't play here";
  }
  function toLink(t, msg) {
    state.mode = 'link';
    state.playing = false; state.loading = false;
    state.position = 0;
    state.duration = (t.durationMs || 0) / 1000;
    state.message = msg || linkMessage(t);
    emitState(); emitTime();
  }

  /* ---------------- core transport ---------------- */
  function canInline(t) {
    if (!t || bad.has(t.id)) return false;
    if (t.source === 'local') return !!t.fileUrl;
    if (t.source === 'youtube') return !!t.ytId && ytAvailable();
    if (remoteCan(t)) return true;   // HOOK: full song via the Spotify Web Playback SDK (hosted pages)
    if (t.fileUrl) return true;
    return !!t.previewUrl && !previewsBlocked;

  function stopAll(keepRemote) {
    token++;
    clearTimeout(startTimer);
    audioRelease();
    ytRelease();
    remoteRelease(keepRemote);   // HOOK: Spotify Web Playback SDK
  }

  function start(t) {
    const toRemote = remoteCan(t);
    stopAll(toRemote);
    state.track = t;
    state.position = 0;
    state.duration = (t.durationMs || 0) / 1000;
    state.playing = false;
    state.loading = false;
    state.message = '';
    Pod.bus.emit('player:track', t);
    setSessionMeta(t);

    if (t.source === 'youtube') {
      if (t.ytId && ytAvailable() && !bad.has(t.id)) startYouTube(t);
      else toLink(t, 'Opens on YouTube');
    } else if (t.fileUrl && !bad.has(t.id)) {
      state.message = '';
      startAudio(t.fileUrl, 'local');
    } else if (toRemote) {
      startRemote(t);              // HOOK: full song inside the page (hosted, logged in)
    } else if (t.source === 'spotify' && t.previewUrl && !previewsBlocked && !bad.has(t.id)) {

      state.duration = 30;

    orderPos = pos;
    state.index = order[pos];

    start(state.queue[state.index]);
  }

  // next position in play order, honoring repeat 'all' wrap; -1 at the end

    if (pos + 1 < order.length) return pos + 1;
    if (state.repeat === 'all' && order.length) {
      if (state.shuffle && order.length > 1) {
        const last = order[order.length - 1];
        order = shuffled(order);
        if (order[0] === last) order.push(order.shift()); // avoid immediate repeat
      }
      return 0;
    }
    return -1;
  }

  function stopAtEnd() {
    if (audioActive) { try { audio.pause(); audio.currentTime = 0; } catch (e) {} }
    if (ytActive && yt && ytReady) { try { yt.stopVideo(); } catch (e) {} }
    if (remoteActive) { const P = webPlayback(); if (P && !remote.pending) { P.pause(); P.seek(0); } remote.pos = 0; }
    state.playing = false; state.loading = false; state.position = 0;
    emitState(); emitTime();
  }

  // automatic advance after a track ends / fails: skip anything that can't play inline
  function advanceAuto() {
    autoAdvancing = false;
    if (!order.length) return;
    let pos = orderPos;
    for (let n = 0; n < order.length; n++) {
      pos = nextPos(pos);
      if (pos < 0) break;
      const t = state.queue[order[pos]];
      if (canInline(t)) { setTimeout(() => goTo(pos, true), 0); return; }
    }
    // nothing playable left: stay on the current track (link mode stays link mode)
    if (state.mode !== 'link') stopAtEnd(); else emitState();
  }

  function onEnded() {
    if (state.repeat === 'one') {
      if (audioActive) { audio.currentTime = 0; audio.play().catch(() => {}); return; }
      if (ytActive && yt) { try { yt.seekTo(0, true); yt.playVideo(); } catch (e) {} return; }
      if (remoteActive) { goTo(orderPos, true); return; }
    }
    state.playing = false;
    const pos = nextPos(orderPos);
    if (pos < 0) { stopAtEnd(); return; }
    autoAdvancing = true;
    // find first inline-playable track from pos
    let p = pos;
    for (let n = 0; n < order.length; n++) {
      if (canInline(state.queue[order[p]])) { goTo(p, true); return; }
      p = nextPos(p);
      if (p < 0) break;
    }
    autoAdvancing = false;
    stopAtEnd();
  }

  const player = {
    state, videoEl,
    play(track, queue, index) {
      if (!track) return;
      queue = (queue && queue.length) ? queue.slice() : [track];
      if (index == null || index < 0 || queue[index] !== track) {
        index = queue.indexOf(track);
        if (index < 0) index = queue.findIndex(q => q && q.id === track.id);
        if (index < 0) { queue = [track]; index = 0; }
      }
      const same = state.track && state.track.id === track.id && (state.mode === 'local' || state.mode === 'preview' || state.mode === 'youtube' || state.mode === 'spotify');
      state.queue = queue;

    ytList = ytList.map(t => Pod.library.get(t.id) || t);
    store.set('ytList', ytList.map(t => ({ id: t.ytId, title: t.title, artist: t.artist })));
  }

  const youtube = {
    available: false,
    init() {
      const saved = store.get('ytList', []);
      if (Array.isArray(saved) && saved.length) {
        ytList = saved.map(x => {
          const id = typeof x === 'string' ? x : x && x.id;
          return ID_RE.test(id || '') ? ytTrack(id, x && x.title, x && x.artist) : null;
        }).filter(Boolean);
        Pod.library.setList('youtube', ytList);
      }
      let settled = false;
      if (window.YT && window.YT.Player) { ready(); return; }
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () {
        try { if (typeof prev === 'function') prev(); } catch (e) {}
        ready();
      };
      function ready() { settled = true; youtube.available = true; Pod.bus.emit('youtube:ready'); }
      const fail = () => { if (!settled) { settled = true; youtube.available = false; } };
      try {
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        s.async = true;
        s.onerror = fail;
        (document.head || document.body).appendChild(s);
      } catch (e) { fail(); }
      setTimeout(fail, 6000);
    },
    addUrl(url) {
      const id = parseYouTubeId(url);
      if (!id) return null;
      const existing = ytList.find(t => t.ytId === id);
      if (existing) return Pod.library.get(existing.id) || existing;
      const t = ytTrack(id);
      ytList.push(t);
      Pod.library.setList('youtube', ytList.slice());
      persist();
      return t;
    },
    persist,
    parseId: parseYouTubeId
  };
  Pod.sources.youtube = youtube;
})();

<script>/* ---- spotify-web.js ---- */
/* spotify-web.js — Spotify for HOSTED pages (e.g. Netlify): Authorization Code + PKCE (no server, no secret),
   Spotify Web API for lists/search/now-playing, and the Web Playback SDK so full songs play inside the page.

   Only used when the page is a top-level http(s) page with no claude.ai connector (see the hooks in
   sources.js). Inside the Claude artifact the connector path in sources.js runs unchanged.

   Pod.sources.spotifyWeb = {
     isHosted(), preferNow(), init(), connect(opts), loadList(kind), search(q),
     login(), logout(), getClientId(), setClientId(id), redirectUri(), loggedIn(),
     playbackMessage,                    // e.g. Premium required (shown in the Spotify menu)
     playback: { usable(), ready, deviceId, activate(), start(uris, pos), release(), toggle(), pause(), resume(),
                 next(), prev(), seek(ms), setVolume(v), setRepeat(mode), fixModes(sdkState) }
   }
   Events: 'spotifyweb:state' (SDK player state | null), 'spotifyweb:autoplay', 'spotifyweb:error' ({kind, message}) */
(function () {
  'use strict';
  const Pod = window.Pod;
  const store = Pod.util.store;
  const S = Pod.sources.spotify;          // the shared facade from sources.js (same status/statusMessage/... surface)
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const AUTH_URL = 'https://accounts.spotify.com/authorize';
  const TOKEN_URL = 'https://accounts.spotify.com/api/token';
  const API = 'https://api.spotify.com/v1';
  const SDK_URL = 'https://sdk.scdn.co/spotify-player.js';
  const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state ' +
    'user-read-recently-played user-library-read user-top-read';
  const K = { client: 'spotifyWeb:clientId', tokens: 'spotifyWeb:tokens', pkce: 'spotifyWeb:pkce' };
  const NOW_POLL_MS = 30000;
  const LIST_UNAVAILABLE = 'Not available for this Spotify app';

  const MSG = {
    needId: 'Log in to play your Spotify songs here. First time? Open Setup Help.',
    idle: 'Log in to play full songs from your Spotify account (Premium).',
    connecting: 'Connecting to Spotify…',
    redirecting: 'Opening the Spotify login…',
    denied: 'Spotify login was cancelled. Choose Log in with Spotify to try again.',
    expired: 'Your Spotify login expired. Log in with Spotify again.',
    notRegistered: 'Your Spotify account isn’t allowed to use this app yet. In the Spotify Developer Dashboard open your app → User Management, add your Spotify name and email, then log in again.',
    invalidClient: 'Spotify didn’t accept that Client ID. Check it with Change Client ID (Spotify Dashboard → your app → Settings).',
    network: 'Couldn’t reach Spotify. Check your connection and try again.',
    busy: 'Spotify is busy right now. Try again in a moment.',
    premium: 'Spotify Premium is required to play full songs here. Songs play a 30-sec preview or open in Spotify instead.',
    noSdk: 'This browser can’t play Spotify inside the page. Songs play a 30-sec preview or open in Spotify instead.',
    stateMismatch: 'That Spotify login didn’t match this page. Choose Log in with Spotify to try again.'
  };
  const redirectMsg = () => 'Spotify rejected the Redirect URI. In your Spotify app’s settings it must be exactly: ' + redirectUri();

  /* ---------------- environment ---------------- */
  // Normalized so /nano, /nano/ and /nano/index.html all use one Redirect URI.
  function redirectUri() {
    let p = location.pathname.replace(/index\.html?$/i, '');
    if (!p.endsWith('/')) p += '/';
    return location.origin + p;
  }
  function isTopLevel() { try { return window.self === window.top; } catch (e) { return false; } }
  function isHosted() {
    return /^https?:$/.test(location.protocol) && isTopLevel() &&
      !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues) && typeof fetch === 'function';
  }
  function authParams() {
    try {
      const p = new URLSearchParams(location.search);
      if (p.has('state') && (p.has('code') || p.has('error'))) return p;
    } catch (e) {}
    return null;
  }
  function stripQuery() {
    try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (e) {}
  }

  /* ---------------- storage ---------------- */
  function getClientId() { const v = store.get(K.client, ''); return typeof v === 'string' ? v : ''; }
  function setClientId(id) { store.set(K.client, String(id || '').trim()); }
  function getTokens() { const t = store.get(K.tokens, null); return t && t.access && t.refresh ? t : null; }
  function saveTokens(t) { store.set(K.tokens, t); scheduleRefresh(); }
  function clearTokens() { store.set(K.tokens, null); clearTimeout(refreshTimer); }

  function setStatus(st, msg) { S._setStatus(st, msg); }
  function fail(e) { S.lastError = e; return e; }

  /* ---------------- PKCE ---------------- */
  function randomString(n) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const a = new Uint8Array(n); crypto.getRandomValues(a);
    let s = ''; for (let i = 0; i < n; i++) s += chars[a[i] % chars.length];
    return s;
  }
  function b64url(buf) {
    const u8 = new Uint8Array(buf); let s = '';
    for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function challengeOf(verifier) {
    return b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  }

  async function login() {
    const clientId = getClientId();
    if (!clientId) { setStatus('idle', MSG.needId); return false; }
    setStatus('connecting', MSG.redirecting);
    try {
      const verifier = randomString(64), state = randomString(16);
      const challenge = await challengeOf(verifier);
      const ru = redirectUri();
      store.set(K.pkce, { verifier, state, redirectUri: ru, clientId, at: Date.now() });
      const q = new URLSearchParams({
        response_type: 'code', client_id: clientId, scope: SCOPES, redirect_uri: ru, state,
        code_challenge_method: 'S256', code_challenge: challenge
      });
      location.assign(AUTH_URL + '?' + q.toString());
      return false;   // the page navigates away; status explains what's happening meanwhile
    } catch (e) {
      setStatus('error', 'Couldn’t start the Spotify login: ' + ((e && e.message) || e));
      return false;
    }
  }

  // Back from accounts.spotify.com with ?code=&state= (or ?error=)
  async function handleRedirect(p) {
    stripQuery();
    const pk = store.get(K.pkce, null);
    store.set(K.pkce, null);
    if (!pk || p.get('state') !== pk.state) { fail({ code: 'state_mismatch', message: MSG.stateMismatch }); setStatus('error', MSG.stateMismatch); return false; }
    const err = p.get('error');
    if (err) {
      const msg = err === 'access_denied' ? MSG.denied : 'Spotify login failed: ' + err;
      fail({ code: err, message: msg }); setStatus(err === 'access_denied' ? 'idle' : 'error', msg);
      return false;
    }
    setStatus('connecting', MSG.connecting);
    let res;
    try {
      res = await tokenRequest({ grant_type: 'authorization_code', client_id: pk.clientId, code: p.get('code'),
        redirect_uri: pk.redirectUri, code_verifier: pk.verifier });
    } catch (e) {
      fail(e); setStatus('error', e.message || MSG.network); return false;
    }
    saveTokens(tokensFrom(res, null));
    return true;
  }

  // Came back (Back button) from a Spotify error page without a code: usually INVALID_CLIENT / bad redirect URI.
  function checkAbandonedLogin() {
    const pk = store.get(K.pkce, null);
    if (!pk) return false;
    store.set(K.pkce, null);
    if (Date.now() - (pk.at || 0) > 15 * 60 * 1000) return false;
    const msg = 'Login didn’t finish. If Spotify showed INVALID_CLIENT, check the Client ID, and that the Redirect URI in your Spotify app is exactly: ' + redirectUri();
    fail({ code: 'login_incomplete', message: msg });
    setStatus('error', msg);
    return true;
  }

  function tokensFrom(res, prev) {
    return {
      access: res.access_token,
      refresh: res.refresh_token || (prev && prev.refresh),
      expiresAt: Date.now() + (Number(res.expires_in) || 3600) * 1000,
      scope: res.scope || (prev && prev.scope) || ''
    };
  }

  async function tokenRequest(form) {
    let r;
    try {
      r = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(form).toString() });
    } catch (e) { throw { code: 'network', message: MSG.network }; }
    let body = null; try { body = await r.json(); } catch (e) {}
    if (r.ok && body && body.access_token) return body;
    const code = (body && body.error) || ('http_' + r.status);
    const desc = String((body && body.error_description) || '');
    let message;
    if (code === 'invalid_client') message = MSG.invalidClient;
    else if (/redirect/i.test(desc)) message = redirectMsg();
    else if (code === 'invalid_grant') message = form.grant_type === 'refresh_token' ? MSG.expired : 'The Spotify login expired before it finished. Try again.';
    else if (r.status === 429) message = MSG.busy;
    else if (r.status >= 500) message = MSG.network;
    else message = 'Spotify login failed: ' + (desc || code);
    throw { code, status: r.status, message };
  }

  /* ---------------- access tokens ---------------- */
  let refreshing = null, refreshTimer = 0;
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    const t = getTokens(); if (!t) return;
    const ms = Math.max(5000, t.expiresAt - Date.now() - 5 * 60 * 1000);
    refreshTimer = setTimeout(() => { refresh().catch(() => {}); }, Math.min(ms, 2147483000));
  }
  function refresh() {
    if (refreshing) return refreshing;
    const t = getTokens();
    if (!t) return Promise.reject(loggedOut(MSG.expired));
    refreshing = tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh, client_id: getClientId() })
      .then(res => { const nt = tokensFrom(res, t); saveTokens(nt); return nt.access; },
        e => {
          if (e && (e.code === 'invalid_grant' || e.code === 'invalid_client' || e.status === 400 || e.status === 401)) {
            throw loggedOut(e.code === 'invalid_client' ? MSG.invalidClient : MSG.expired);
          }
          throw e;   // network etc.: keep the tokens, try again later
        })
      .finally(() => { refreshing = null; });
    return refreshing;
  }
  function getToken(force) {
    const t = getTokens();
    if (!t) return Promise.reject(loggedOut(MSG.expired));
    if (!force && t.expiresAt - Date.now() > 60 * 1000) return Promise.resolve(t.access);
    return refresh();
  }
  function loggedOut(msg) {
    clearTokens(); teardown();
    const e = fail({ code: 'needs_reauth', message: msg });
    setStatus('needs_reauth', msg);
    return e;
  }

  /* ---------------- Web API ---------------- */
  async function api(method, path, body) {
    let authRetry = false, tries = 0;
    for (;;) {
      const token = await getToken();
      let r;
      try {
        r = await fetch(API + path, { method, headers: Object.assign({ Authorization: 'Bearer ' + token },
          body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
      } catch (e) {
        if (tries++ < 1) { await sleep(800); continue; }
        throw { code: 'network', message: MSG.network };
      }
      if (r.status === 401 && !authRetry) { authRetry = true; await getToken(true); continue; }
      if (r.status === 429 && tries++ < 2) {
        const ra = Number(r.headers.get('Retry-After'));
        await sleep(Math.min(10000, (isFinite(ra) && ra > 0 ? ra * 1000 : 1500)));
        continue;
      }
      if ((r.status === 502 || r.status === 503) && tries++ < 1) { await sleep(1000); continue; }
      if (r.status === 204 || r.status === 202) return null;
      const text = await r.text().catch(() => '');
      let json = null; try { json = text ? JSON.parse(text) : null; } catch (e) {}
      if (r.ok) return json;
      const message = String((json && json.error && (json.error.message || json.error)) || text || ('HTTP ' + r.status));
      const reason = json && json.error && json.error.reason;
      if (r.status === 401) throw loggedOut(MSG.expired);
      if (r.status === 403 && /not\s+(be\s+)?registered/i.test(message)) throw { code: 'not_registered', status: 403, message: MSG.notRegistered };
      if (r.status === 429) throw { code: 'rate_limited', status: 429, message: MSG.busy, userMessage: MSG.busy };
      throw { code: 'http_' + r.status, status: r.status, reason, message };
    }
  }

  function mapTracks(arr) {
    const out = [], seen = new Set();
    (arr || []).forEach(o => {
      if (!o || o.is_local || typeof o.uri !== 'string' || o.uri.indexOf('spotify:track:') !== 0) return;
      const t = S._trackFromAny(o);
      if (t && !seen.has(t.id)) { seen.add(t.id); out.push(t); }
    });
    return out;
  }

  const LISTS = {
    recent: () => api('GET', '/me/player/recently-played?limit=50').then(j => mapTracks(((j && j.items) || []).map(i => i && i.track))),
    liked: () => api('GET', '/me/tracks?limit=50').then(j => mapTracks(((j && j.items) || []).map(i => i && i.track))),
    top: () => api('GET', '/me/top/tracks?limit=50&time_range=medium_term').then(j => mapTracks((j && j.items) || []))
  };

  // Errors a list/search resolves [] for: record them so the UI can explain ("Not available for this Spotify app").
  function listError(e) {
    if (!e || typeof e !== 'object') e = { code: 'unknown', message: String(e) };
    if (e.code === 'needs_reauth' || e.code === 'not_registered') {
      if (e.code === 'not_registered') setStatus('error', MSG.notRegistered);
      return fail(e);
    }
    if (e.status === 403 || e.status === 404) e.userMessage = LIST_UNAVAILABLE;
    else if (e.code === 'network') e.userMessage = MSG.network;
    else if (!e.userMessage) e.userMessage = 'Spotify error: ' + (e.message || e.code);
    fail(e);
    Pod.bus.emit('spotify:status', { status: S.status, statusMessage: S.statusMessage, lastError: e });
    return e;
  }

  async function fetchList(kind) {
    const tracks = await LISTS[kind]();
    Pod.library.setList('spotify:' + kind, tracks);
    return tracks;
  }

  let searchSeq = 0;
  async function search(query) {
    const q = String(query || '').trim();
    if (!q) return [];
    const my = ++searchSeq;
    const path = off => '/search?type=track&limit=10&offset=' + off + '&q=' + encodeURIComponent(q);
    try {
      // dev-mode apps get at most 10 results per request: fetch two pages for 20
      const [a, b] = await Promise.all([api('GET', path(0)), api('GET', path(10)).catch(() => null)]);
      const items = [].concat((a && a.tracks && a.tracks.items) || [], (b && b.tracks && b.tracks.items) || []);
      const tracks = mapTracks(items);
      if (my === searchSeq) Pod.library.setList('spotify:search', tracks);
      S.lastError = null;
      return tracks;
    } catch (e) { listError(e); return []; }
  }

  /* ---------------- connect / now playing ---------------- */
  let connecting = null, nowTimer = 0;
  function connect(opts) {
    const quiet = !!(opts && opts.quiet);
    if (connecting) return connecting;
    if (!getTokens()) return login();
    connecting = (async () => {
      S.lastError = null;
      setStatus('connecting', MSG.connecting);
      try {
        const me = await api('GET', '/me').catch(e => {
          if (e && (e.code === 'not_registered' || e.code === 'needs_reauth' || e.code === 'network')) throw e;
          return null;    // other /me errors don't block browsing
        });
        spotifyWeb.product = (me && me.product) || null;
        const settled = await Promise.all(['recent', 'liked'].map(k => fetchList(k).then(t => t, e => { listError(e); return []; })));
        if (S.lastError && (S.lastError.code === 'needs_reauth' || S.lastError.code === 'not_registered')) throw S.lastError;
        const n = new Set(settled[0].concat(settled[1]).map(t => t.id)).size;
        S.lastError = null;
        if (spotifyWeb.product && spotifyWeb.product !== 'premium') spotifyWeb.playbackMessage = MSG.premium;
        setStatus('connected', n ? 'Connected · ' + n + (n === 1 ? ' song' : ' songs') : 'Connected');
        startNowPlaying();
        loadSdk();
        return true;
      } catch (e) {
        fail(e);
        if (e.code === 'needs_reauth') { /* status set by loggedOut() */ }
        else if (e.code === 'not_registered') setStatus('error', MSG.notRegistered);
        else setStatus('error', quiet && e.code === 'network' ? MSG.network : (e.message || MSG.network));
        return false;
      }
    })().finally(() => { connecting = null; });
    return connecting;
  }

  function pollNow() {
    return api('GET', '/me/player/currently-playing?additional_types=track,episode').then(j => {
      S._setNowPlaying(j && j.item ? S._parseNowPlaying(j) : null);
    }, e => { if (e && e.code === 'needs_reauth') S._setNowPlaying(null); });
  }
  function startNowPlaying() {
    clearInterval(nowTimer);
    pollNow();
    nowTimer = setInterval(() => { if (getTokens() && document.visibilityState !== 'hidden') pollNow(); }, NOW_POLL_MS);
  }

  function logout() {
    clearTokens();
    teardown();
    ['recent', 'liked', 'top', 'search'].forEach(k => Pod.library.setList('spotify:' + k, []));
    S.lastError = null;
    spotifyWeb.playbackMessage = '';
    setStatus('idle', getClientId() ? MSG.idle : MSG.needId);
  }

  function teardown() {
    clearInterval(nowTimer); nowTimer = 0;
    S._setNowPlaying(null);
    if (Pod.player && Pod.player.state && Pod.player.state.mode === 'spotify') { try { Pod.player.pause(); } catch (e) {} }
    if (sdk.player) { try { sdk.player.disconnect(); } catch (e) {} }
    sdk.player = null; sdk.ready = false; sdk.deviceId = null;
    sdk.loaded = !!(window.Spotify && window.Spotify.Player);
    sdk.error = null;
    rejectWaiters({ code: 'logged_out', message: MSG.expired });
  }

  /* ---------------- Web Playback SDK ---------------- */
  const sdk = { loaded: false, loading: false, player: null, ready: false, deviceId: null, error: null,
    waiters: [], authRetried: false, playSeq: 0, lastAction: 'release', lastState: null, modesFixed: {} };

  function loadSdk() {
    if (!getTokens()) return;
    if (window.Spotify && window.Spotify.Player) { sdk.loaded = true; createPlayer(); return; }
    if (sdk.loading) return;
    sdk.loading = true;
    const prev = window.onSpotifyWebPlaybackSDKReady;
    window.onSpotifyWebPlaybackSDKReady = function () {
      try { if (typeof prev === 'function') prev(); } catch (e) {}
      sdk.loaded = true; sdk.loading = false; createPlayer();
    };
    try {
      const s = document.createElement('script');
      s.src = SDK_URL; s.async = true;
      s.onerror = () => { sdk.loading = false; sdkFatal('load', MSG.noSdk); };
      (document.head || document.body).appendChild(s);
    } catch (e) { sdk.loading = false; sdkFatal('load', MSG.noSdk); }
  }

  function sdkFatal(kind, message) {
    sdk.error = kind; sdk.ready = false;
    spotifyWeb.playbackMessage = message;
    rejectWaiters({ code: kind, message });
    Pod.bus.emit('spotifyweb:error', { kind, message, fatal: true });
    Pod.bus.emit('spotify:status', { status: S.status, statusMessage: S.statusMessage, lastError: S.lastError });
  }

  function createPlayer() {
    if (sdk.player || !getTokens() || !(window.Spotify && window.Spotify.Player)) return;
    const vol = Pod.player && Pod.player.state ? Pod.player.state.volume : 0.8;
    let p;
    try {
      p = new window.Spotify.Player({
        name: 'Nano Player',
        getOAuthToken: cb => { getToken().then(cb, () => {}); },
        volume: Math.max(0, Math.min(1, Number(vol) || 0))
      });
    } catch (e) { sdkFatal('init', MSG.noSdk); return; }
    sdk.player = p;
    p.addListener('ready', d => {
      if (sdk.player !== p) return;
      sdk.deviceId = d && d.device_id; sdk.ready = !!sdk.deviceId; sdk.error = null;
      const w = sdk.waiters; sdk.waiters = []; w.forEach(x => x.resolve(sdk.deviceId));
    });
    p.addListener('not_ready', () => { if (sdk.player === p) sdk.ready = false; });
    p.addListener('player_state_changed', st => { if (sdk.player === p) { sdk.lastState = st; Pod.bus.emit('spotifyweb:state', st); } });
    p.addListener('autoplay_failed', () => { if (sdk.player === p) Pod.bus.emit('spotifyweb:autoplay'); });
    p.addListener('initialization_error', () => { if (sdk.player === p) sdkFatal('init', MSG.noSdk); });
    p.addListener('account_error', () => { if (sdk.player === p) sdkFatal('premium', MSG.premium); });
    p.addListener('authentication_error', () => {
      if (sdk.player !== p) return;
      if (sdk.authRetried) { loggedOut(MSG.expired); return; }
      sdk.authRetried = true;
      getToken(true).then(() => {
        if (sdk.player !== p) return;
        try { p.disconnect(); } catch (e) {}
        sdk.ready = false;
        Promise.resolve(p.connect()).catch(() => {});
      }, () => {});
    });
    p.addListener('playback_error', e => {
      if (sdk.player === p) Pod.bus.emit('spotifyweb:error', { kind: 'playback', message: 'Couldn’t play this song on Spotify', fatal: false });
    });
    Promise.resolve(p.connect()).then(ok => {
      if (ok === false && sdk.player === p) {
        setTimeout(() => { if (sdk.player === p && !sdk.ready) Promise.resolve(p.connect()).then(ok2 => { if (ok2 === false && sdk.player === p) sdkFatal('init', MSG.noSdk); }); }, 2000);
      }
    }, () => { if (sdk.player === p) sdkFatal('init', MSG.noSdk); });
  }

  function rejectWaiters(err) { const w = sdk.waiters; sdk.waiters = []; w.forEach(x => x.reject(err)); }

  /* Spotify */
  function spotifyMenu() {
    const scr = {
      kind: 'menu', title: 'Spotify',

      items: () => {
        const S = spotify();

        const status = S.status;
        const msg = S.statusMessage || '';
        const W = webSpotify();   // HOOK: hosted page (Spotify login + Web Playback SDK); null inside Claude
        if (status === 'connected') {
          const items = [
            { label: 'Recently Played', chevron: true, action: () => spotifyListScreen('recent', 'Recently Played') },
            { label: 'Liked Songs', chevron: true, action: () => spotifyListScreen('liked', 'Liked Songs') },
            { label: 'Most Played', chevron: true, action: () => spotifyListScreen('top', 'Most Played') },
            { label: 'Search…', action: spotifySearch },
            { label: 'Playing on Spotify', chevron: true, action: spotifyNowScreen }
          ];
          if (W) {
            if (W.playbackMessage) items.push({ label: W.playbackMessage, disabled: true, multiline: true });
            items.push({ label: 'Change Client ID', action: () => changeClientId(scr, false) },
              { label: 'Log Out', action: () => { safe(() => W.logout()); toast('Logged out of Spotify'); refreshIf(scr); } });
          }
          return items;
        }
        if (W && status !== 'connecting') {
          const items = [{ label: 'Log in with Spotify', chevron: true, action: () => webLogin(scr) },
            { label: 'Setup Help', chevron: true, action: setupHelpScreen }];
          if (W.getClientId()) items.push({ label: 'Change Client ID', action: () => changeClientId(scr, false) });
          if (msg) items.push({ label: msg, disabled: true, multiline: true });
          return items;

        if (status === 'unavailable') {
          return [{ label: msg || 'Spotify isn’t available in this view.', disabled: true, multiline: true }];
        }

          return [{ label: 'Connecting…', disabled: true }].concat(msg ? [{ label: msg, disabled: true, multiline: true }] : []);
        }
        const items = [{ label: status === 'needs_reauth' ? 'Reconnect Spotify' : 'Connect Spotify', chevron: true, action: () => connectSpotify(scr) }];
        if (msg) items.push({ label: msg, disabled: true, multiline: true });

  function connectSpotify(scr) {
    const S = spotify();
    if (!S || typeof S.connect !== 'function') { toast('Spotify unavailable'); return; }
    let p;
    try { p = S.connect(); } catch (e) { toast(errText(e)); return; }
    toast('Connecting to Spotify…');
    refreshIf(scr);

      refreshIf(scr);

  /* HOOK (hosted pages): Spotify login with the user's own Spotify developer app (src/spotify-web.js) */
  function webSpotify() {

  }
  // Ask for the Client ID (in-screen prompt). Resolves the saved ID, or null if cancelled/invalid.
  function changeClientId(scr, thenLogin) {
    const W = webSpotify(); if (!W) return Promise.resolve(null);

  function setupHelpScreen() {

    const items = [
      { label: '1. Open developer.spotify.com/dashboard (log in) and choose Create app.', multiline: true,

      { label: uri, multiline: true, action: () => {

        Promise.resolve(p).then(() => toast(p ? 'Redirect URI copied' : uri), () => toast(uri));

  // A Spotify call resolved with nothing: if it recorded a new error meanwhile, return text explaining it.
  function failedEmpty(S, list, errBefore) {
    if ((list && list.length) || !S.lastError || S.lastError === errBefore) return null;
    if (S.lastError.userMessage) return String(S.lastError.userMessage);   // HOOK (hosted): e.g. "Not available for this Spotify app"
    if (S.status !== 'connected' && S.statusMessage) return S.statusMessage;
    return 'Couldn’t reach Spotify. Try again in a moment.';
  }
  function trackListItems(list, loading, error, retry, emptyLabel) {
    if (list && list.length) return list.map((t, i) => ({ label: t.title, action: () => playList(list, i) }));
    if (loading) return [{ label: 'Loading…', disabled: true }];
    if (error) return [{ label: 'Couldn’t load', disabled: true }, { label: error, disabled: true, multiline: true },
      { label: 'Try Again', action: retry }];
    return [{ label: emptyLabel || 'No songs', disabled: true }];
  }
  function spotifyListScreen(kind, title) {
    let loading = false, error = null, started = false;
    const scr = {
      kind: 'menu', title,
      items: () => {
        const L = library();
        const list = (L && safe(() => L.list('spotify:' + kind), [])) || [];
        return trackListItems(list, loading, error, load, 'No songs here yet');
      },
      onShow() { if (!started) { started = true; load(); } }
    };
    function load() {
      const S = spotify();
      if (!S || typeof S.loadList !== 'function') { error = 'Spotify unavailable'; refreshIf(scr); return; }
      loading = true; error = null;
      const errBefore = S.lastError;
      let p;
      try { p = S.loadList(kind); } catch (e) { p = Promise.reject(e); }
      refreshIf(scr);
      // sources resolve [] on failure (never reject) and record S.lastError: surface that instead of "No songs"
      Promise.resolve(p).then(list => { loading = false; error = failedEmpty(S, list, errBefore); refreshIf(scr); },
        e => { loading = false; error = (S.statusMessage && S.status !== 'connected') ? S.statusMessage : errText(e); refreshIf(scr); });
    }

  }
  function spotifySearch() {

  function spotifyResultsScreen(q) {
    let loading = true, error = null, results = null;

      items: () => trackListItems(results, loading, error, run, 'No results'),
      onShow() { if (!scr._started) { scr._started = true; run(); } }
    };
    function run() {
      const S = spotify();
      if (!S || typeof S.search !== 'function') { loading = false; error = 'Spotify unavailable'; refreshIf(scr); return; }
      loading = true; error = null;
      const errBefore = S.lastError;
      let p;
      try { p = S.search(q); } catch (e) { p = Promise.reject(e); }
      refreshIf(scr);
      Promise.resolve(p).then(list => {
        loading = false;
        results = Array.isArray(list) ? list : ((library() && library().list('spotify:search')) || []);
        error = failedEmpty(S, results, errBefore);
        refreshIf(scr);
      }, e => { loading = false; error = errText(e); refreshIf(scr); });
    }
    return scr;
  }

  /* ---------------- Now Playing ---------------- */
  function artInto(img, x) {
    if (!x) return;
    if (Pod.art && typeof Pod.art.apply === 'function') safe(() => Pod.art.apply(img, x, 300));
  }
  function buildArt(parent, refs) {
    refs.artbox = h('div', 'np-artbox', parent);
    refs.art = h('img', 'np-art', refs.artbox); refs.art.alt = ''; refs.art.draggable = false;

  function nowPlayingScreen() {
    let root = null, r = {}, offs = [], mode = 'normal', modeTimer = 0, volTimer = 0, lastId = null, active = false, lastRepeatAt = 0;
    const MODES = ['normal', 'scrub', 'shuffle', 'repeat'];
    const st = () => { const P = player(); return P && P.state; };

    function build() {
      root.textContent = '';
      const np = r.np = h('div', 'np', root);
      np.dataset.mode = 'normal';
      const topLine = h('div', 'np-top', np);
      r.count = h('span', '', topLine);
      r.icons = h('span', 'np-icons', topLine);
      buildArt(np, r);
      r.badge = h('div', 'np-badge', r.artbox, '30-sec preview');

      r.album = h('div', 'np-album', meta);
